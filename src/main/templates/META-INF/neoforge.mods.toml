modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rat Lab"
credits="Thanks to the NeoForge, KubeJS, FTB, Lootr and JEI teams for their APIs."
# Placeholder until the CurseForge project page exists.
displayURL="https://www.curseforge.com/minecraft/mc-mods/signal-radar"
description='''
A handheld radar powered by Forge Energy, with its display on the item itself. Five tiers raise range,
precision and addon slots; addons pick what it detects (containers, ores, animals, structures, moving
mobs, manholes, unopened Lootr chests, teammates). Narrative targets are plain datapack JSON, with
per-player unlocks and stages, a KubeJS-ready event and binding API, and a NeoForge API for other mods.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="${kubejs_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="manholes"
    type="optional"
    versionRange="${manholes_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lootr"
    type="optional"
    versionRange="${lootr_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="${ftbteams_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="NONE"
    side="CLIENT"
