modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rat Lab, Stefano Manca"
credits="Thanks to the Forge, KubeJS, FTB, Lootr and JEI teams for their APIs."
displayURL="https://www.curseforge.com/minecraft/mc-mods/signal-radar"
description='''
A handheld radar powered by Forge Energy, with its display on the item itself. Five tiers raise range,
precision and addon slots; addons pick what it detects (containers, ores, animals, structures, moving
mobs, manholes, unopened Lootr chests, teammates). Narrative targets are plain datapack JSON, with
per-player unlocks and stages, a KubeJS-ready event and binding API, and an API for other mods.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="${kubejs_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="manholes"
    mandatory=false
    versionRange="${manholes_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lootr"
    mandatory=false
    versionRange="${lootr_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    mandatory=false
    versionRange="${ftbteams_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="BOTH"
