plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Runs every registered game test, then exits. Tests are only registered with this flag.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'signalradar.gametests', 'true'
        }
        // Same game tests with Manhole Travel, Lootr and FTB Teams (+ FTB Library, Architectury) dropped into run-compat/mods
        // (see tools/prepare-compat-run.sh); the compat detectors are exercised for real. Not part of the default check.
        gameTestServerCompat {
            type = "gameTestServer"
            gameDirectory = project.file('run-compat')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'signalradar.gametests', 'true'
        }
        // Dev client with KubeJS + Rhino and the example scripts (run-kubejs, prepared by tools/prepare-kubejs-run.sh): in-game
        // check of the custom addons (generic tinted model, fallback name) and the example server script.
        clientKubeJS {
            client()
            gameDirectory = project.file('run-kubejs')
        }
        // Same game tests with KubeJS + Rhino dropped into run-kubejs/mods and the example scripts of src/test_datapack/kubejs
        // copied into run-kubejs/kubejs (see tools/prepare-kubejs-run.sh); KubeJSGameTests run for real. Not part of the default check.
        gameTestServerKubeJS {
            type = "gameTestServer"
            gameDirectory = project.file('run-kubejs')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'signalradar.gametests', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { name = "LatvianModder (KubeJS, Rhino)"; url = "https://maven.latvian.dev/releases"
            content { includeGroup "dev.latvian.mods" } }
    maven { name = "FTB"; url = "https://maven.ftb.dev/releases"
            content { includeGroup "dev.ftb.mods" } }
    maven { name = "Architectury"; url = "https://maven.architectury.dev"
            content { includeGroup "dev.architectury" } }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integrations, compile-only (never bundled, never on the dev-run classpath: runGameTestServer proves the mod has no
    // hard dependency). Code that touches them lives in compat/ and is only class-loaded after a ModList check.
    compileOnly("dev.latvian.mods:kubejs-neoforge:2101.7.2-build.377") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:2101.2.7-build.85") { transitive = false }
    // Manhole Travel and Lootr: jars copied from the pack into libs/ (gitignored, never committed or bundled).
    compileOnly files('libs/manholes-1.7.0.jar')
    compileOnly files('libs/lootr-neoforge-1.21.1-1.11.38.127.jar')
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:2101.1.11") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:2101.1.36") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:13.0.11") { transitive = false }

    // Unit tests cover the pure display math (package display, no Minecraft classes).
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // ScreenLayout parses JSON with Gson (same version Minecraft 1.21.1 ships).
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            kubejs_version_range   : kubejs_version_range,
            manholes_version_range : manholes_version_range,
            lootr_version_range    : lootr_version_range,
            ftbteams_version_range : ftbteams_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    // Game test template: needed by runGameTestServer (reads resources from the source set), not by players.
    exclude('data/signalradar/structure/gametest_*.nbt')
}
